[weakdeps]
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"

# NOTE: the extension triggers on `Makie` alone, not `GLMakie` --
# Makie's own public API (Figure/Axis/lines!/heatmap!/surface!) is backend-
# agnostic, and `using GLMakie` (or `using WGLMakie`) loads Makie as a real
# transitive dependency into the process, which is enough to activate a
# `Makie`-keyed extension regardless of which concrete backend the *user*
# chose. This keeps a browser/remote deployment (WGLMakie) a zero-code-change
# swap. GLMakie stays a declared weakdep because the GUI viewers may need
# GLMakie-specific widget/event APIs beyond plain Makie.

[extensions]
GuliwerrJMakieExt = "Makie"

[compat]
FFTW = "1.10.0"
SpecialFunctions = "2"
julia = "1.13"
